<title>Agnew Project Page — Preview</title>
<style>
:root {
    --ab-deep: #1A1A1A;
    --ab-brand-blue-light: #7FD8E8;
    --ab-font-heading: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --ab-font-body: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --ab-fs-sm: 0.9375rem;
    --ab-fs-h2: clamp(1.875rem, 3.5vw, 2.75rem);
    --ab-transition: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    --ab-shadow-lg: 0 24px 60px rgba(26, 26, 26, 0.4);
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--ab-font-body); color: rgba(255,255,255,.8); background: var(--ab-deep); }
.ast-container { max-width: 1200px; margin: 0 auto; padding: 40px 24px 0; }
.ab-entry-content h1, .ab-entry-content h2 { color: #fff; font-family: var(--ab-font-heading); margin: 0 0 .5em; }
.ab-entry-content h2 { font-size: var(--ab-fs-h2); margin-bottom: 24px; }
.demo-note { font-family: var(--ab-font-heading); color: var(--ab-brand-blue-light); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; text-align: center; padding: 14px 0; border-bottom: 1px dashed rgba(255,255,255,.2); }

/* ---- accordion (real theme CSS, unchanged, now hand-written markup) ---- */
.ab-photo-accordion {
    --ab-item-h: 400px;
    display: flex; flex-direction: column; width: 100vw;
    margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw);
    gap: 10px;
    height: calc(var(--count, 6) * var(--ab-item-h)); overflow: hidden;
}
.ab-photo-accordion__item {
    position: relative; display: block; flex: 1 1 0%; min-height: 90px; overflow: hidden;
    color: inherit; text-decoration: none;
    transition: flex-grow var(--ab-transition);
}
.ab-photo-accordion__item img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: brightness(0.82); transform: scale(1.04);
    transition: filter 0.5s ease, transform 0.6s ease;
}
.ab-photo-accordion__item:hover,
.ab-photo-accordion__item:focus-within { flex-grow: 5; }
.ab-photo-accordion__item:hover img,
.ab-photo-accordion__item:focus-within img { filter: brightness(1); transform: scale(1); }
.ab-photo-accordion__item figcaption {
    position: absolute; inset: auto 0 0 0; margin: 0; padding: 20px 24px;
    background: linear-gradient(to top, rgba(26,26,26,.85) 0%, rgba(26,26,26,.2) 60%, transparent 100%);
    color: #fff; font-size: var(--ab-fs-sm); text-align: left;
    opacity: 0; transition: opacity var(--ab-transition);
}
.ab-photo-accordion__item:hover figcaption,
.ab-photo-accordion__item:focus-within figcaption { opacity: 1; }

/* ---- lightbox (real theme CSS, unchanged) ---- */
.ab-lightbox {
    display: none; position: fixed; inset: 0; z-index: 9998;
    align-items: center; justify-content: center; padding: clamp(20px, 5vw, 60px);
    background: rgba(11,11,11,.94); cursor: zoom-out;
}
.ab-lightbox:target { display: flex; }
.ab-lightbox img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; box-shadow: var(--ab-shadow-lg); }
.ab-lightbox__close {
    position: absolute; top: 18px; right: 24px; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.75rem; line-height: 1; color: #fff;
    border: 1px solid rgba(255,255,255,.3); border-radius: 50%;
}
</style>
